<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissor</title>
</head>
<body>
    <h2>Computer Choice: <span id="computerChoice"></span></h2>
    <h2>Player Choice: <span id="playerChoice"></span></h2>

    <h2>Result: <span id="result"></span></h2>

    <button id="rock">Rock</button>
    <button id="paper">Paper</button>
    <button id="scissor">Scissor</button>

    <!-- tally score, separate from the result given-->
    <h4>Human: <span id="human"></span></h4>
    <h4>Computer: <span id="computer"></span></h4>

    <script src="app.js" charset="utf-8"></script>
</body>
</html>
