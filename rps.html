    <header>
        <label for="tabs"><h1><a href="index.html" style="text-decoration: none; color: black;">js Games</a></h1><span aria-hidden="true">▽</span></label>

            <option value="volvo" href="rps.html">Game 1</option>

    <div class="game">
        <h2>Computer Choice: <span id="computerChoice"></span></h2>
        <h2>Player Choice: <span id="playerChoice"></span></h2>

        <h2>Result: <span id="result"></span></h2>

        <button class="rowBtn" id="rock">🪨</button>
        <button class="rowBtn" id="paper">📃</button>
        <button class="rowBtn" id="scissor">✂️</button>

        <!-- tally score, separate from the result given -->
        <h4>Human: <span id="human"></span></h4>
        <h4>Computer: <span id="computer"></span></h4>
